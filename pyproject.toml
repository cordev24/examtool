[project]
name = "exam-generator-ia"
version = "1.0.0"
description = "Sistema de generación de exámenes universitarios con IA local (Ollama)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Universidad", email = "admin@universidad.edu" }
]
keywords = ["examen", "ia", "ollama", "educacion", "universidad"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "ollama>=0.6.1",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "requests>=2.33.1",
    "ttkbootstrap>=1.20.2",
]

[project.scripts]
exam-generator = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules", "main.py"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
]
